[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "kiwi-skin"
version = "0.4.0"
description = "Prompt injection sanitizer for AI agents — guards user input, RAG chunks, tool outputs, and LLM responses"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
features = ["python"]
module-name = "kiwi"
