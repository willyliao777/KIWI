[package]
name = "kiwi"
version = "0.2.0"
edition = "2024"

[lib]
name = "kiwi"
crate-type = ["cdylib", "rlib"]

[dependencies]
unicode-normalization = "0.1"
regex = "1"
once_cell = "1"

[dependencies.pyo3]
version = "0.23"
features = ["extension-module"]
optional = true

[features]
python = ["pyo3"]
